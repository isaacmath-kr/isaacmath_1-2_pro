<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isaac Math · 중1 2학기 강의노트</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#0f1830; --card:rgba(30,41,66,0.55); --border:rgba(148,163,184,0.18);
    --text:#e7ecf3; --muted:#9aa7bd; --green:#34d399; --green-d:#059669; --blue:#60a5fa; --gold:#fbbf24; --purple:#c4b5fd;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%, rgba(52,211,153,0.12), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(96,165,250,0.10), transparent 55%), var(--bg);
    color:var(--text); line-height:1.7; min-height:100vh; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:880px;margin:0 auto;padding:56px 24px 90px;}
  .cover{text-align:center;margin-bottom:36px;}
  .pro-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;color:#1a1205;
    background:linear-gradient(135deg,#fde68a,var(--gold));padding:5px 12px;border-radius:6px;margin-bottom:16px;}
  .cover h1{font-size:40px;font-weight:800;letter-spacing:-0.035em;line-height:1.15;}
  .cover .accent{width:64px;height:3px;background:linear-gradient(90deg,var(--green),var(--gold));margin:18px auto;border-radius:3px;}
  .cover .sub{color:var(--muted);font-size:15px;}
  .overall{max-width:520px;margin:24px auto 0;background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:16px 20px;backdrop-filter:blur(10px);}
  .overall .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px;}
  .bar{height:8px;border-radius:6px;background:rgba(148,163,184,0.18);overflow:hidden;}
  .bar > i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:6px;transition:width .4s;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:28px;}
  .unit{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:22px 24px;backdrop-filter:blur(10px);transition:.15s;box-shadow:0 10px 30px rgba(0,0,0,0.22);}
  .unit:hover{border-color:var(--green);transform:translateY(-2px);}
  .unit.soon{opacity:.55;pointer-events:none;}
  .unit .u-no{font-size:12px;font-weight:800;color:var(--green);letter-spacing:.04em;}
  .unit .u-title{font-size:18px;font-weight:800;margin:6px 0 14px;letter-spacing:-0.02em;}
  .unit .u-bar{height:6px;border-radius:5px;background:rgba(148,163,184,0.18);overflow:hidden;margin-bottom:6px;}
  .unit .u-bar > i{display:block;height:100%;width:0%;background:var(--green);border-radius:5px;}
  .unit .u-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);}
  .unit .u-go{margin-top:14px;font-size:13px;font-weight:700;color:var(--green);}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:40px;}
  @media (max-width:600px){.grid{grid-template-columns:1fr;}.cover h1{font-size:30px;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="cover">
    <div class="pro-badge">PRO</div>
    <h1>Isaac Math · 중1 2학기</h1>
    <div class="accent"></div>
    <div class="sub">개념 강의노트 + 인터랙티브 퀴즈 + 연습문제(기본·응용·심화)</div>
    <div class="overall">
      <div class="lbl"><span>학기 전체 진행률</span><span id="ovPct">0%</span></div>
      <div class="bar"><i id="ovBar"></i></div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot">
  <p style="margin-bottom:6px;"><a href="/" style="color:var(--muted);">Isaac Math 홈</a> · <a href="/privacy.html" style="color:var(--muted);">개인정보처리방침</a></p>
  © Isaac Math · 개인 학습용으로 자유롭게 이용하세요. 무단 복제·재배포는 금합니다.</div>
</div>

<script>
const UNITS=[
  {no:'1단원', title:'기본 도형', file:'note_1-2_1_기본도형_PRO.html', ls:'isaacmath_note_1-2-1_v1', secs:7},
  {no:'2단원', title:'위치 관계', file:'note_1-2_2_위치관계_PRO.html', ls:'isaacmath_note_1-2-2_v1', secs:7},
  {no:'3단원', title:'평행선', file:'note_1-2_3_평행선_PRO.html', ls:'isaacmath_note_1-2-3_v1', secs:6},
  {no:'4단원', title:'작도와 합동', file:'note_1-2_4_작도와합동_PRO.html', ls:'isaacmath_note_1-2-4_v1', secs:8}
];
function pct(u){
  try{const s=JSON.parse(localStorage.getItem(u.ls));if(s&&Array.isArray(s.done)&&u.secs)return Math.round(s.done.length/u.secs*100);}catch(e){}
  return 0;
}
const grid=document.getElementById('grid');
let sum=0,cnt=0;
UNITS.forEach(u=>{
  const p=pct(u);if(!u.soon){sum+=p;cnt++;}
  const a=document.createElement('a');
  a.className='unit'+(u.soon?' soon':'');
  if(!u.soon)a.href=u.file;
  a.innerHTML='<div class="u-no">'+u.no+'</div><div class="u-title">'+u.title+'</div>'+
    '<div class="u-bar"><i style="width:'+p+'%"></i></div>'+
    '<div class="u-meta"><span>진행률 '+p+'%</span><span>'+(u.soon?'준비중':'클릭해 열기')+'</span></div>'+
    '<div class="u-go">'+(u.soon?'곧 추가됩니다':'강의노트 열기 →')+'</div>';
  grid.appendChild(a);
});
const ov=cnt?Math.round(sum/cnt):0;
document.getElementById('ovPct').textContent=ov+'%';
document.getElementById('ovBar').style.width=ov+'%';
</script>
</body>
</html>
